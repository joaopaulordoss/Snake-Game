<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="styles.css">
    <title>Snake Game</title>
</head>

<body>
    <div class="container">
        <canvas id="canvas" width="300" height="300"></canvas>

        <div class="info">
            <h1>Snake Game</h1>
            <p> Eat the red food and don't bite your tail</p>

            <div class="score-box">
                Score:
                <b id="score">0</b>
            </div>

            <small>Use the arrow keys to control the snake</small>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
